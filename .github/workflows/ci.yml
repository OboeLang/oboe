name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch supersedes an in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src/*.o and bin/oboe are committed, and git does not preserve mtimes:
      # after checkout make may consider them up to date and skip compiling,
      # which would silently test the committed binary instead of this commit.
      # cleaning first forces a real build.
      - name: Build from scratch and run the test suite
        working-directory: compiler
        run: |
          make clean
          make test

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pinned to match the version used locally; minor releases disagree on
      # enough edge cases that an unpinned clang-format fails on CI only
      - name: Install clang-format
        run: pip install --disable-pip-version-check clang-format==22.1.8

      - name: Check formatting
        run: clang-format --dry-run -Werror $(git ls-files '*.c' '*.h')

  warnings:
    name: warnings-as-errors (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -Werror rides on CC rather than CFLAGS so the Makefile's flags stay the
      # single source of truth and cannot drift out of sync with this workflow
      - name: Build with -Werror
        working-directory: compiler
        run: |
          make clean
          make CC="clang -Werror"

  bootstrap:
    name: bootstrap (stage2 == stage3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler proper is written in Oboe and lives in bin/oboec, built
      # from the committed bootstrap/oboec.c. This asserts the fixpoint: a
      # compiler built from what the bootstrap produces produces that same C
      # again. stage1 (the committed file) may legitimately differ from both,
      # since it was generated before whatever change is being tested.
      #
      # `make clean` matters even more here than elsewhere bc bin/oboec is a
      # third committed binary that a stale build could inadvertantly test
      # in place of this commit.
      - name: Check the compiler reproduces itself
        working-directory: compiler
        run: |
          make clean
          make bootstrap-check

      # The other jobs run the suite on the Oboe front end, which is the only
      # supported one. This run keeps the deprecated in-process C codegen from
      # rotting: the selfhost gates already compare its output to oboec's on
      # every file, but nothing else exercises it as a whole compiler, and it
      # is only worth keeping around as a fallback for as long as it works.
      - name: Run the test suite on the deprecated C front end
        working-directory: compiler
        run: OBOE_USE_C_FRONTEND=1 make test

  macos:
    name: build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # `gcc` on a macOS runner is Apple's clang shim, so the Makefile's
      # CC = gcc needs no override.
      #
      # this covers `oboe run` on darwin and nothing more: cross-compiling
      # (-t macos from another host), .app bundling and the desktop metadata
      # paths have no coverage anywhere, so a green tick here is not a claim
      # that macOS is a supported build target.
      - name: Build from scratch and run the test suite
        working-directory: compiler
        run: |
          make clean
          make test
